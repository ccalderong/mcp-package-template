[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-data-mcp"
version = "1.0.0"
description = "MCP server template — replace with your project description"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==4.0.5",
    "packaging>=24.0",
    "pymysql>=1.1.0",
    "DBUtils>=3.0.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
include = ["mcp_server*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "slow: marks tests that require network access or long computation",
]
